<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>${title}</title>
  <style>
    body { margin: 0; background: #f3f4f6; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif; }
    .wechat-shell { max-width: 820px; margin: 0 auto; padding: 32px 16px 72px; }
    .wechat-article { background: #fff; padding: 36px 24px; border-radius: 18px; box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08); }
    .wechat-title { margin: 0 0 12px; font-size: 32px; line-height: 1.3; color: #111827; }
    .wechat-meta { margin: 0 0 24px; color: #6b7280; font-size: 14px; }
    .wechat-digest { margin: 0 0 28px; padding: 14px 16px; border-radius: 12px; background: #ecfdf5; border-left: 4px solid #10b981; color: #065f46; }
    .wechat-content { font-size: 17px; line-height: 1.9; }
    .wechat-content p { margin: 1em 0; }
    .wechat-content h1, .wechat-content h2, .wechat-content h3 { margin: 1.7em 0 0.8em; line-height: 1.45; color: #111827; }
    .wechat-content h1 { font-size: 1.8em; }
    .wechat-content h2 { font-size: 1.45em; padding-left: 0.65em; border-left: 4px solid #10b981; }
    .wechat-content h3 { font-size: 1.2em; }
    .wechat-content blockquote { margin: 1.2em 0; padding: 0.95em 1em; background: #f9fafb; border-left: 4px solid #d1d5db; color: #4b5563; }
    .wechat-content ul, .wechat-content ol { margin: 1em 0; padding-left: 1.4em; }
    .wechat-content li { margin: 0.4em 0; }
    .wechat-content hr { margin: 2em auto; width: 28%; border: none; border-top: 1px solid #d1d5db; }
    .wechat-content pre { overflow-x: auto; padding: 14px 16px; border-radius: 12px; background: #111827; color: #f9fafb; font-size: 14px; line-height: 1.6; }
    .wechat-content code { padding: 0.15em 0.35em; border-radius: 6px; background: #eef2ff; color: #4338ca; font-size: 0.92em; }
    .wechat-content pre code { padding: 0; background: transparent; color: inherit; }
    .wechat-content figure { margin: 1.5em 0; }
    .wechat-content img { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 12px; }
    .wechat-content figcaption { margin-top: 0.7em; text-align: center; color: #6b7280; font-size: 13px; }
    .wechat-footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wechat-shell">
    <article class="wechat-article">
      <h1 class="wechat-title">${title}</h1>
      <p class="wechat-meta">${author_line}</p>
      ${digest_block}
      <section class="wechat-content">${content}</section>
      ${footer_block}
    </article>
  </div>
</body>
</html>
