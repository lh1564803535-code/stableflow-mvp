services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
      - "18791:18791"

    volumes:
      - openclaw_data:/root/.openclaw
    environment:
      - TZ=Asia/Shanghai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}

volumes:
  openclaw_data: 