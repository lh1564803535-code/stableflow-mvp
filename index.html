<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StableFlow</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#landing">
          <span class="brand-mark">SF</span>
          <span class="brand-copy">
            <strong>StableFlow</strong>
            <small>stablecoin marketplace for services</small>
          </span>
        </a>
        <div class="topbar-actions">
          <nav class="nav">
            <a href="#landing">Home</a>
            <a href="#browse">Browse</a>
            <a href="#create">Sell</a>
            <a href="#orders">Orders</a>
            <a href="#sales">Sales</a>
          </nav>
          <div class="command-badge">
            <span class="command-dot"></span>
            Base Sepolia + USDC
          </div>
          <button class="lang-toggle" onclick="toggleLang()" id="lang-btn">中文</button>
        </div>
      </header>

      <main id="app"></main>
    </div>

    <!-- ═══ Landing ═══ -->
    <template id="landing-template">
      <section class="hero hero-shell" style="position:relative;overflow:hidden;">
        <!-- Animated background orbs -->
        <div class="hero-orb" style="top:-10%;left:20%;width:400px;height:400px;background:rgba(124,58,237,0.12);"></div>
        <div class="hero-orb" style="bottom:-10%;right:20%;width:350px;height:350px;background:rgba(6,182,212,0.1);animation-delay:-3s;"></div>
        <!-- Subtle grid lines -->
        <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0.08;">
          <div style="position:absolute;height:1px;background:rgba(255,255,255,0.3);top:25%;left:0;right:0;"></div>
          <div style="position:absolute;height:1px;background:rgba(255,255,255,0.3);top:50%;left:0;right:0;"></div>
          <div style="position:absolute;height:1px;background:rgba(255,255,255,0.3);top:75%;left:0;right:0;"></div>
        </div>

        <div class="hero-copy" style="position:relative;">
          <div class="eyebrow-row animate-on-scroll">
            <span class="eyebrow">Stablecoin marketplace</span>
            <span class="eyebrow-chip">Base Sepolia + USDC</span>
          </div>
          <h1 class="animate-on-scroll" style="transition-delay:100ms;">
            使用 <span class="hl">USDC</span> 进行安全交易<br>
            <span class="hl" id="hero-word-rotate"></span> 托管资金
          </h1>
          <p class="hero-text animate-on-scroll" style="transition-delay:200ms;">
            StableFlow 是新一代稳定币自由职业市场。通过智能合约托管保护，让每一笔交易都安全可靠。
          </p>
          <div class="hero-actions animate-on-scroll" style="transition-delay:300ms;">
            <a class="button button-primary" data-route-link="#browse" href="#browse">浏览服务 →</a>
            <a class="button button-secondary" data-route-link="#create" href="#create">成为卖家</a>
          </div>
          <!-- Trust badges -->
          <div class="animate-on-scroll" style="margin-top:32px;display:flex;flex-wrap:wrap;gap:24px;font-size:0.85rem;color:var(--muted-foreground);transition-delay:400ms;">
            <div style="display:flex;align-items:center;gap:8px;"><span style="color:var(--status-released);">✓</span> 智能合约托管</div>
            <div style="display:flex;align-items:center;gap:8px;"><span style="color:var(--status-released);">✓</span> 2% 平台手续费</div>
            <div style="display:flex;align-items:center;gap:8px;"><span style="color:var(--status-released);">✓</span> 全球即时结算</div>
          </div>
        </div>

        <div class="hero-summary panel animate-on-scroll" style="transition-delay:200ms;">
          <div class="summary-strip">
            <div>
              <p class="card-label">Platform</p>
              <h2>如何运作</h2>
            </div>
          </div>
          <div class="how-it-works-grid animate-stagger">
            <article class="float-animation">
              <span>🔒</span>
              <strong>选择服务</strong>
              <p>浏览数千名经过验证的自由职业者，找到满足您需求的完美服务。</p>
            </article>
            <article class="float-animation" style="animation-delay:-2s;">
              <span>💰</span>
              <strong>托管付款</strong>
              <p>使用 USDC 支付，资金安全托管在智能合约中，直到里程碑完成。</p>
            </article>
            <article class="float-animation" style="animation-delay:-4s;">
              <span>⚡</span>
              <strong>即时释放</strong>
              <p>满意交付后立即释放资金，卖家秒到账，无需等待。</p>
            </article>
          </div>
          <div class="hero-callout pulse-glow">
            <p class="card-label">Fee</p>
            <p>2% 平台手续费。Gas 费仅在 Base 上产生。</p>
          </div>
        </div>
      </section>

      <!-- Stats Marquee -->
      <section style="padding:32px 0;overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
        <div class="marquee-container">
          <div class="marquee-content" id="stats-marquee"></div>
        </div>
      </section>
    </template>

    <!-- ═══ Browse ═══ -->
    <template id="browse-template">
      <section class="page-header">
        <div>
          <p class="section-label">Marketplace</p>
          <h1>Browse services</h1>
        </div>
        <a class="button button-primary" data-route-link="#create" href="#create">Sell a service</a>
      </section>

      <div class="category-filter">
        <button class="category-btn is-active" data-category="all">All</button>
        <button class="category-btn" data-category="design">🎨 Design</button>
        <button class="category-btn" data-category="development">💻 Development</button>
        <button class="category-btn" data-category="writing">✍️ Writing</button>
        <button class="category-btn" data-category="video">🎬 Video</button>
        <button class="category-btn" data-category="translation">🌐 Translation</button>
        <button class="category-btn" data-category="other">📦 Other</button>
      </div>

      <div class="service-grid" id="service-grid"></div>
    </template>

    <!-- ═══ Service Detail ═══ -->
    <template id="service-template">
      <section class="page-header">
        <div>
          <p class="section-label">Service</p>
          <h1>Service detail</h1>
        </div>
        <a class="button button-secondary" data-route-link="#browse" href="#browse">← Back to browse</a>
      </section>
      <div id="service-detail-content"></div>
    </template>

    <!-- ═══ Create Service ═══ -->
    <template id="create-template">
      <section class="page-header">
        <div>
          <p class="section-label">Sell</p>
          <h1>Create service</h1>
        </div>
      </section>

      <section class="panel" style="padding:28px;">
        <form id="create-service-form">
          <div class="form-topline">
            <div>
              <p class="card-label">Service details</p>
              <h2>List your service on the marketplace</h2>
            </div>
            <span class="eyebrow-chip">USDC payments</span>
          </div>

          <div class="field-grid">
            <label>
              Service title
              <input name="title" placeholder="e.g. Logo Design for Startups" required />
            </label>
            <label>
              Category
              <select name="category">
                <option value="design">🎨 Design</option>
                <option value="development">💻 Development</option>
                <option value="writing">✍️ Writing</option>
                <option value="video">🎬 Video</option>
                <option value="translation">🌐 Translation</option>
                <option value="other">📦 Other</option>
              </select>
            </label>
          </div>

          <label>
            Description
            <textarea name="description" rows="4" placeholder="Describe what you offer, your process, and what the client can expect." required></textarea>
          </label>

          <label>
            Price (USDC)
            <input name="price" type="number" min="1" step="1" placeholder="500" required />
          </label>

          <div style="margin-top:20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <p class="card-label">Milestones</p>
              <span id="milestone-total-percent" style="font-weight:700;">0%</span>
            </div>
            <p style="font-size:0.8rem;opacity:0.6;margin:4px 0 8px;">Percentages must sum to exactly 100%</p>
            <div class="milestone-form-list" id="milestone-form-list"></div>
            <button type="button" class="button button-secondary" id="add-milestone-btn" style="font-size:0.8rem;padding:8px 16px;">+ Add milestone</button>
          </div>

          <div class="form-actions" style="margin-top:24px;">
            <button class="button button-primary" type="submit">Publish service</button>
          </div>
        </form>
      </section>
    </template>

    <!-- ═══ My Orders (Buyer) ═══ -->
    <template id="orders-template">
      <section class="page-header">
        <div>
          <p class="section-label">Buyer</p>
          <h1>My orders</h1>
        </div>
        <a class="button button-secondary" data-route-link="#browse" href="#browse">Browse services</a>
      </section>
      <div id="orders-content"></div>
    </template>

    <!-- ═══ My Sales (Seller) ═══ -->
    <template id="sales-template">
      <section class="page-header">
        <div>
          <p class="section-label">Seller</p>
          <h1>My sales</h1>
        </div>
        <a class="button button-primary" data-route-link="#create" href="#create">Create service</a>
      </section>
      <div id="sales-content"></div>
    </template>

    <!-- ═══ Profile ═══ -->
    <template id="profile-template">
      <section class="page-header">
        <div>
          <p class="section-label">Account</p>
          <h1>Profile</h1>
        </div>
      </section>
      <div id="profile-content"></div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
