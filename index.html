<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StableFlow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#landing">
          <span class="brand-mark">SF</span>
          <span class="brand-copy">
            <strong>StableFlow</strong>
            <small>stablecoin invoicing and treasury for teams with taste</small>
          </span>
        </a>
        <div class="topbar-actions">
          <nav class="nav">
            <a href="#landing">Overview</a>
            <a href="#create">Create invoice</a>
            <a href="#dashboard">Dashboard</a>
          </nav>
          <div class="command-badge">
            <span class="command-dot"></span>
            Base Sepolia signal reactor
          </div>
        </div>
      </header>

      <main id="app"></main>
    </div>

    <template id="landing-template">
      <section class="hero hero-shell">
        <div class="hero-copy">
          <div class="eyebrow-row">
            <span class="eyebrow">Signal-driven treasury ops</span>
            <span class="eyebrow-chip">Base Sepolia + USDC + market mood</span>
          </div>
          <h1>Turn stablecoin settlement into a treasury game board with market signals, AI operator notes, and delightfully explicit control.</h1>
          <p class="hero-text">
            StableFlow gives teams one finance cockpit for real settlement, external probability signals, reserve posture, and post-event routing. It feels serious enough for treasury ops and playful enough to make judges lean in.
          </p>
          <div class="hero-actions">
            <a class="button button-primary" data-route-link="#create" href="#create">Create invoice</a>
            <a class="button button-secondary" data-route-link="#dashboard" href="#dashboard">Open live dashboard</a>
          </div>
          <div class="hero-rail">
            <span>Real settlement rail</span>
            <span>Polymarket-style signal input</span>
            <span>AI routing theatre</span>
          </div>
        </div>

        <div class="hero-summary panel">
          <div class="summary-strip">
            <div>
              <p class="card-label">This week</p>
              <h2 id="hero-total-collected">0 USDC</h2>
            </div>
            <span class="trend" id="hero-trend">Signal reactor warming up</span>
          </div>
          <div class="summary-grid">
            <article>
              <span>Live treasury</span>
              <strong id="hero-open-count">0</strong>
            </article>
            <article>
              <span>Market mood</span>
              <strong id="hero-paid-today">0</strong>
            </article>
            <article>
              <span>Ready to route</span>
              <strong id="hero-ready-to-split">0</strong>
            </article>
          </div>
          <div class="hero-callout">
            <p class="card-label">Operating principle</p>
            <p>Signals can get spicy. AI can get chatty. Funds still move only when the wallet owner says yes.</p>
          </div>
        </div>
      </section>

      <section class="feature-row">
        <article class="panel feature-card">
          <p class="card-label">Settlement</p>
          <h3>Feed the treasury with real on-chain USDC</h3>
          <p>Kick off the demo with a real Base Sepolia settlement so the rest of the story has actual financial gravity.</p>
        </article>
        <article class="panel feature-card">
          <p class="card-label">Signals</p>
          <h3>Blend market heat with operator judgment</h3>
          <p>Use Polymarket-style external signals, reviewer input, and ops notes to turn capital posture into something legible and fun.</p>
        </article>
        <article class="panel feature-card">
          <p class="card-label">Routing</p>
          <h3>Turn confidence into reserve and payout moves</h3>
          <p>Show what gets held, what gets routed, and what stays in suspense while the signal board keeps changing.</p>
        </article>
      </section>

      <section class="trust-strip panel">
        <div>
          <p class="card-label">Control surface</p>
          <h2>Built for teams that want their treasury demo to feel less like a billing tool and more like a live strategy room.</h2>
        </div>
        <div class="trust-grid">
          <article>
            <span>Settlement rail</span>
            <strong>Injected wallet + real ERC-20 transfer + on-chain proof</strong>
          </article>
          <article>
            <span>Signal layer</span>
            <strong>Polymarket-style probability snapshots, ops notes, and review pressure</strong>
          </article>
          <article>
            <span>Action layer</span>
            <strong>Reserve posture, routing intent, and explicit treasury approval</strong>
          </article>
        </div>
      </section>

      <section class="signal-band">
        <article class="signal-card">
          <span>Why it wins</span>
          <strong>It is a real payment demo disguised as a much more interesting treasury game.</strong>
        </article>
        <article class="signal-card">
          <span>Why it matters</span>
          <strong>Market signals explain what treasury should do next instead of leaving capital decisions as black-box vibes.</strong>
        </article>
        <article class="signal-card">
          <span>Why it is fun</span>
          <strong>You get Polymarket energy, without pretending the whole product is a prediction market clone.</strong>
        </article>
      </section>
    </template>

    <template id="create-template">
      <section class="page-header">
        <div>
          <p class="section-label">Step 1</p>
          <h1>Create invoice</h1>
        </div>
        <a class="button button-secondary" data-route-link="#dashboard" href="#dashboard">Load spicy demo state</a>
      </section>

      <section class="grid two-column form-layout">
        <form class="panel form-panel" id="invoice-form">
          <div class="form-topline">
            <div>
              <p class="card-label">Event payload</p>
              <h2>Frame the request, the thesis, and the treasury intent</h2>
            </div>
            <span class="eyebrow-chip">Serious UI, mischievous energy</span>
          </div>

          <div class="field-grid">
            <label>
              Counterparty / team
              <input name="clientName" placeholder="Northstar Labs" required />
            </label>
            <label>
              Treasury size (USDC)
              <input name="amount" type="number" min="1" step="0.01" placeholder="1850" required />
            </label>
            <label>
              Decision deadline
              <input name="dueAt" type="date" required />
            </label>
            <label>
              Recipient wallet
              <input name="recipientAddress" placeholder="0xA4f0000000000000000000000000000000dE91" required />
            </label>
          </div>

          <label>
            Event thesis
            <input name="milestoneTitle" placeholder="Election night liquidity sprint" required />
          </label>

          <label>
            Treasury intent
            <textarea
              name="note"
              rows="4"
              placeholder="Fund rapid design, live analytics, and operator coverage for a volatile event window with market-sensitive routing after settlement."
              required
            ></textarea>
          </label>

          <div class="form-actions">
            <button class="button button-primary" type="submit">Generate signal-aware rail</button>
            <button class="button button-secondary" type="button" id="seed-invoice">Load playful sample</button>
          </div>
        </form>

        <aside class="panel preview-panel">
          <div class="form-topline">
            <div>
              <p class="card-label">Live preview</p>
              <h2>Inspect the move before capital enters the board</h2>
            </div>
            <span class="eyebrow-chip">Base Sepolia</span>
          </div>
          <div id="invoice-preview"></div>
        </aside>
      </section>
    </template>

    <template id="pay-template">
      <section class="page-header">
        <div>
          <p class="section-label">Step 2</p>
          <h1>Settlement reactor</h1>
        </div>
        <a class="button button-secondary" data-route-link="#dashboard" href="#dashboard">View signal cockpit</a>
      </section>
      <section id="pay-view"></section>
    </template>

    <template id="dashboard-template">
      <section class="page-header">
        <div>
          <p class="section-label">Step 3</p>
          <h1>Dashboard</h1>
        </div>
        <a class="button button-primary" data-route-link="#create" href="#create">Spin up new request</a>
      </section>

      <section id="ops-spotlight"></section>

      <section class="stats-row" id="stats-row"></section>

      <section class="grid two-column dashboard-grid">
        <div class="stack">
          <div class="panel">
            <div class="panel-head">
              <div>
                <p class="card-label">Treasury view</p>
                <h2>Capital posture board</h2>
              </div>
            </div>
            <div id="treasury-panel"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <div>
                <p class="card-label">Decision queue</p>
                <h2>Requests waiting for treasury moves</h2>
              </div>
            </div>
            <div id="open-invoices"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <div>
                <p class="card-label">Funded rail</p>
                <h2>Capital already on the board</h2>
              </div>
            </div>
            <div id="paid-invoices"></div>
          </div>
        </div>

        <div class="stack">
          <div class="panel">
            <div class="panel-head">
              <div>
                <p class="card-label">AI treasury operator</p>
                <h2>Decision memo</h2>
              </div>
            </div>
            <div id="summary-panel"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <div>
                <p class="card-label">Signal reactor</p>
                <h2>Market mood and operating events</h2>
              </div>
            </div>
            <div id="activity-panel"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <div>
                <p class="card-label">Step 4</p>
                <h2>Routing move</h2>
              </div>
            </div>
            <form id="split-form" class="split-form"></form>
          </div>

          <div class="panel">
            <div class="panel-head">
              <div>
                <p class="card-label">Outgoing</p>
                <h2>Recent routing intents</h2>
              </div>
            </div>
            <div id="recent-payouts"></div>
          </div>
        </div>
      </section>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
